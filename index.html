<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Railway</title>
<style>
/* Layout: full-screen canvas with a small speedometer and controls at bottom left. Single dark theme for the night scene. */
:root {
  --bg: #02030a;
  --ink: #d9dcf0;
  --dim: #7d8199;
  --amber: #ffb35a;
  --panel: rgba(10, 12, 26, 0.62);
  --line: rgba(160, 170, 220, 0.22);
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --sans: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--sans); }
html.screensaver, html.screensaver body { cursor: none; }
html.screensaver .hud { display: none; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }

.hud {
  position: fixed;
  left: calc(14px + env(safe-area-inset-left, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  max-width: calc(100vw - 28px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  padding: 8px 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: opacity .6s;
}
.hud.idle { opacity: 0.25; }
.hud:hover { opacity: 1; }
.speed { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 7.5ch; text-align: right;
         touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.speed b { font-size: 22px; font-weight: 500; color: var(--amber); }
.speed span { font-size: 11px; color: var(--dim); letter-spacing: .08em; margin-left: 4px; }
.hud button {
  font: 500 16px var(--mono);
  width: 36px; height: 36px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
}
.hud button:hover { border-color: var(--amber); color: var(--amber); }
.hud button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.hud button:disabled { opacity: 0.58; cursor: wait; }
.hud button.mode { width: auto; min-width: 5.5em; padding: 0 10px; font-family: var(--sans); font-size: 13px; }
.keys { font-size: 11px; color: var(--dim); letter-spacing: .04em; }
@media (max-width: 520px) { .keys { display: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap">
</head>
<body>
<canvas id="scene" aria-label="光る点で描いた夜の鉄道を走る前面展望"></canvas>

<div class="hud" id="hud">
  <button id="slower" type="button" aria-label="減速">−</button>
  <div class="speed" aria-live="off"><b id="kmh">101</b><span>km/h</span></div>
  <button id="faster" type="button" aria-label="加速">＋</button>
  <button id="pause" type="button" aria-label="一時停止">Ⅱ</button>
  <button id="fs" type="button" aria-label="全画面">⛶</button>
  <button id="trackMode" class="mode" type="button" aria-label="複々線に切り替え" aria-pressed="false">複線</button>
  <div class="keys" id="keys">↑↓ 速度 ・ Space 停止 ・ F 全画面</div>
</div>

<script>
(() => {
  // The Windows .scr launcher adds this flag. It removes all controls and the
  // pointer while keeping the normal browser version fully interactive.
  const SCREEN_SAVER = new URLSearchParams(location.search).has('screensaver');
  if (SCREEN_SAVER) document.documentElement.classList.add('screensaver');

  // ---------------- UI language (follows the browser's language settings) ----------------
  const STRINGS = {
    ja: { title: 'Night Railway', scene: '光る点で描いた夜の鉄道を走る前面展望',
          slower: '減速', faster: '加速', pause: '一時停止', resume: '再開',
          fs: '全画面', fsExit: '全画面を解除',
          doubleTrack: '複線', quadrupleTrack: '複々線', switchToDouble: '複線に切り替え', switchToQuadruple: '複々線に切り替え',
          keys: '↑↓ 速度 ・ Space 停止 ・ F 全画面' },
    en: { title: 'Night Railway', scene: 'A night railway cab view drawn with points of light',
          slower: 'Slow down', faster: 'Speed up', pause: 'Pause', resume: 'Resume',
          fs: 'Fullscreen', fsExit: 'Exit fullscreen',
          doubleTrack: 'Double track', quadrupleTrack: 'Four tracks', switchToDouble: 'Switch to double track', switchToQuadruple: 'Switch to four tracks',
          keys: '↑↓ speed · Space pause · F fullscreen' },
    zh: { title: 'Night Railway', scene: '用光点描绘的夜间铁路驾驶室前方景色',
          slower: '减速', faster: '加速', pause: '暂停', resume: '继续',
          fs: '全屏', fsExit: '退出全屏',
          doubleTrack: '双线', quadrupleTrack: '四线', switchToDouble: '切换为双线', switchToQuadruple: '切换为四线',
          keys: '↑↓ 速度 · 空格 暂停 · F 全屏' },
    ko: { title: 'Night Railway', scene: '빛나는 점으로 그린 야간 철도 전면 전망',
          slower: '감속', faster: '가속', pause: '일시 정지', resume: '재개',
          fs: '전체 화면', fsExit: '전체 화면 종료',
          doubleTrack: '복선', quadrupleTrack: '복복선', switchToDouble: '복선으로 전환', switchToQuadruple: '복복선으로 전환',
          keys: '↑↓ 속도 · Space 일시 정지 · F 전체 화면' },
    fr: { title: 'Night Railway', scene: 'Une vue nocturne depuis la cabine d’un train, dessinée avec des points lumineux',
          slower: 'Ralentir', faster: 'Accélérer', pause: 'Pause', resume: 'Reprendre',
          fs: 'Plein écran', fsExit: 'Quitter le plein écran',
          doubleTrack: 'Double voie', quadrupleTrack: 'Quatre voies', switchToDouble: 'Passer à deux voies', switchToQuadruple: 'Passer à quatre voies',
          keys: '↑↓ vitesse · Espace pause · F plein écran' },
    de: { title: 'Night Railway', scene: 'Eine nächtliche Führerstandsansicht aus Lichtpunkten',
          slower: 'Langsamer', faster: 'Schneller', pause: 'Pause', resume: 'Fortsetzen',
          fs: 'Vollbild', fsExit: 'Vollbild beenden',
          doubleTrack: 'Zweigleisig', quadrupleTrack: 'Viergleisig', switchToDouble: 'Auf zwei Gleise wechseln', switchToQuadruple: 'Auf vier Gleise wechseln',
          keys: '↑↓ Tempo · Leertaste Pause · F Vollbild' },
    es: { title: 'Night Railway', scene: 'Una vista nocturna desde la cabina de un tren dibujada con puntos de luz',
          slower: 'Reducir velocidad', faster: 'Acelerar', pause: 'Pausa', resume: 'Reanudar',
          fs: 'Pantalla completa', fsExit: 'Salir de pantalla completa',
          doubleTrack: 'Vía doble', quadrupleTrack: 'Cuatro vías', switchToDouble: 'Cambiar a vía doble', switchToQuadruple: 'Cambiar a cuatro vías',
          keys: '↑↓ velocidad · Espacio pausa · F pantalla completa' },
  };
  // pick the first supported language from the browser's preference list; fall back to English
  const LANG = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'])
    .map(l => String(l).toLowerCase().split('-')[0])
    .find(l => STRINGS[l]) || 'en';
  const T = STRINGS[LANG];
  document.documentElement.lang = LANG;
  document.title = T.title;
  document.getElementById('scene').setAttribute('aria-label', T.scene);
  document.getElementById('slower').setAttribute('aria-label', T.slower);
  document.getElementById('faster').setAttribute('aria-label', T.faster);
  document.getElementById('pause').setAttribute('aria-label', T.pause);
  document.getElementById('fs').setAttribute('aria-label', T.fs);
  document.getElementById('trackMode').setAttribute('aria-label', T.switchToQuadruple);
  document.getElementById('trackMode').textContent = T.doubleTrack;
  document.getElementById('keys').textContent = T.keys;
  // ---------------- Screen ----------------
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  let SW = 0, SH = 0, CX = 0, CY = 0, FOCAL = 960, WRAP = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    SW = window.innerWidth; SH = window.innerHeight;
    cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = SW / 2; CY = SH / 2;
    FOCAL = Math.max(SW / 2, SH * 0.55);   // equivalent to 960 (half the width) in the original code
    WRAP = 2 * Math.PI * FOCAL;             // background width covering 360 degrees
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------- Camera & track ----------------
  const CAM_H = 1.2;
  const MAXD = 600;
  const offX = new Float64Array(MAXD + 2);
  const offY = new Float64Array(MAXD + 2);
  let trackS = 1000, speed = 28, heading = 0;

  // ---------------- Position-based pseudo-random numbers ----------------
  function hash32(x) {
    x = x >>> 0;
    x ^= x >>> 16; x = Math.imul(x, 0x7feb352d);
    x ^= x >>> 15; x = Math.imul(x, 0x846ca68b);
    x ^= x >>> 16;
    return x >>> 0;
  }
  // Capture the clock once. The generated route changes on every launch, but
  // remains stable for the entire session so curves never shift under the cab.
  const WORLD_SEED = Date.now() >>> 0;
  const rnd = (n, salt) =>
    (hash32(Math.imul(n | 0, 2654435761) ^ Math.imul(salt, 0x9E3779B9) ^ WORLD_SEED) & 0xFFFFFF) / 16777216;
  const smooth = t => t * t * (3 - 2 * t);
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const fade = (d, range) => clamp01(1 - d / range);
  const rand = n => Math.floor(Math.random() * (n + 1));   // equivalent to DxLib's GetRand(n)

  // ---------------- Track shape ----------------
  function curvTarget(idx) {
    if (rnd(idx, 1) < 0.35) return 0;
    const mag = 0.0010 + rnd(idx, 2) * 0.0030;
    return rnd(idx, 3) < 0.5 ? -mag : mag;
  }
  function curvature(s) {
    const SEG = 300, idx = Math.floor(s / SEG), t = (s - idx * SEG) / SEG;
    const u = t < 0.35 ? smooth(t / 0.35) : 1;
    return curvTarget(idx - 1) * (1 - u) + curvTarget(idx) * u;
  }
  function slopeTarget(idx) {
    if (rnd(idx, 11) < 0.5) return 0;
    const mag = 0.00004 + rnd(idx, 12) * 0.00012;
    return rnd(idx, 13) < 0.5 ? -mag : mag;
  }
  function vcurvature(s) {
    const SEG = 450, idx = Math.floor(s / SEG), t = (s - idx * SEG) / SEG;
    const u = t < 0.4 ? smooth(t / 0.4) : 1;
    return slopeTarget(idx - 1) * (1 - u) + slopeTarget(idx) * u;
  }
  function updateTrackShape() {
    let ang = 0, pang = 0;
    offX[0] = 0; offY[0] = 0;
    for (let i = 0; i <= MAXD; i++) {
      ang += curvature(trackS + i);
      pang += vcurvature(trackS + i);
      offX[i + 1] = offX[i] + ang;
      offY[i + 1] = offY[i] + pang;
    }
  }

  // point d m ahead, lateral offset lat m, height h m -> screen coordinates
  const P = { x: 0, y: 0, sc: 0 };
  function project(d, lat, h) {
    if (d < 1 || d >= MAXD) return false;
    const i = d | 0, f = d - i;
    const ox = offX[i] * (1 - f) + offX[i + 1] * f;
    const oy = offY[i] * (1 - f) + offY[i + 1] * f;
    P.sc = FOCAL / d;
    P.x = CX + (lat + ox) * P.sc;
    P.y = CY - (h + oy - CAM_H) * P.sc;
    return true;
  }

  // ---------------- Light sprites (created once per color) ----------------
  const sprites = new Map();
  function sprite(r, g, b) {
    const key = r + ',' + g + ',' + b;
    let s = sprites.get(key);
    if (s) return s;
    const N = 128;
    s = document.createElement('canvas'); s.width = s.height = N;
    const c = s.getContext('2d');
    const gr = c.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2);
    const cr = r + (255 - r) * 0.7 | 0, cg = g + (255 - g) * 0.7 | 0, cb = b + (255 - b) * 0.7 | 0;
    gr.addColorStop(0.00, `rgba(${cr},${cg},${cb},1)`);
    gr.addColorStop(0.10, `rgba(${r},${g},${b},0.95)`);
    gr.addColorStop(0.22, `rgba(${r},${g},${b},0.40)`);
    gr.addColorStop(0.50, `rgba(${r},${g},${b},0.10)`);
    gr.addColorStop(1.00, `rgba(${r},${g},${b},0)`);
    c.fillStyle = gr; c.fillRect(0, 0, N, N);
    sprites.set(key, s);
    return s;
  }

  // r = core radius (px); the halo extends to about 4.5x the core
  function glow(x, y, r, col, a) {
    if (a <= 0.003) return;
    if (r < 0.7) { const k = r / 0.7; a *= k < 0.3 ? 0.3 : k; r = 0.7; }
    if (a > 1) a = 1;
    const half = r * 4.5;
    if (x + half < 0 || x - half > SW || y + half < 0 || y - half > SH) return;
    ctx.globalAlpha = a;
    ctx.drawImage(col, x - half, y - half, half * 2, half * 2);
  }

  const C = {
    star:   sprite(200, 200, 255),
    white:  sprite(230, 230, 240),
    refW:   sprite(210, 220, 255),
    refO:   sprite(255, 150, 40),
    lamp:   sprite(255, 170, 70),
    tail:   sprite(255, 35, 20),
    head:   sprite(255, 245, 215),
    cityY:  sprite(255, 210, 140),
    red:    sprite(255, 30, 20),
    signalY: sprite(255, 185, 55),
    signalG: sprite(80, 255, 130),
    cyan:   sprite(110, 210, 255),
    ufoC:   sprite(90, 255, 220),
    ufoM:   sprite(255, 80, 210),
    ufoG:   sprite(150, 255, 90),
  };

  // ---------------- Background (stars & city lights) ----------------
  const stars = [], city = [];
  function initBackground() {
    stars.length = 0; city.length = 0;
    const W = Math.ceil(WRAP);
    for (let i = 0; i < 1400; i++) {
      stars.push({ x: rand(W - 1), yr: Math.random() * 0.83, b: 50 + rand(170),
                   ph: Math.random() * 6.28, big: rand(99) < 3 });
    }
    const pal = [[255, 200, 100], [255, 150, 60], [220, 230, 255]];
    for (let i = 0; i < 900; i++) {
      const r = Math.random(), t = rand(99);
      city.push({ x: rand(W - 1), dy: 3 + r * r * 38, ph: Math.random() * 1.5, b: 70 + rand(150),
                  kind: t < 92 ? 0 : t < 97 ? 1 : 2,
                  col: t < 45 ? pal[0] : t < 70 ? pal[1] : pal[2] });
    }
  }
  initBackground();

  function scrollX(x, wrap) {
    let sx = (x - heading * FOCAL) % wrap;
    if (sx < 0) sx += wrap;
    return sx;
  }

  function drawSkyGlow() {
    const g = ctx.createLinearGradient(0, CY - 170, 0, CY + 24);
    g.addColorStop(0, 'rgba(255,130,60,0)');
    g.addColorStop(0.82, 'rgba(255,130,60,0.14)');
    g.addColorStop(1, 'rgba(255,130,60,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    ctx.fillRect(0, CY - 170, SW, 194);
  }

  function drawStars(time) {
    const W = Math.ceil(WRAP), skyH = CY - 70;
    for (const s of stars) {
      const sx = scrollX(s.x, W);
      if (sx >= SW) continue;
      const sy = s.yr * skyH;
      const tw = 0.75 + 0.25 * Math.sin(time * 2.3 + s.ph);
      if (s.big) { glow(sx, sy, 1.0, C.star, 0.6 * tw); continue; }
      const c = s.b * tw | 0;
      ctx.globalAlpha = 1;
      ctx.fillStyle = `rgb(${c * 0.75 | 0},${c * 0.75 | 0},${c})`;
      ctx.fillRect(sx | 0, sy | 0, 1, 1);
    }
  }

  function drawCity(time) {
    const W = Math.ceil(WRAP);
    for (const L of city) {
      const sx = scrollX(L.x, W);
      if (sx >= SW) continue;
      const y = CY - L.dy;
      if (L.kind === 2) {
        if ((time + L.ph) % 1.5 < 0.2) glow(sx, y, 1.3, C.red, 0.9);
      } else if (L.kind === 1) {
        glow(sx, y, 0.9, C.cityY, 0.5);
      } else {
        ctx.globalAlpha = L.b / 255;
        ctx.fillStyle = `rgb(${L.col[0]},${L.col[1]},${L.col[2]})`;
        ctx.fillRect(sx | 0, y | 0, 1, 1);
      }
    }
  }

  // ---------------- Shooting stars ----------------
  const meteors = [];
  let nextMeteor = 8 + Math.random() * 10;
  function spawnMeteor() {
    // positions live in background coordinates, so meteors scroll with the stars on curves
    const k = FOCAL / 960;
    const dir = Math.random() < 0.5 ? -1 : 1;
    const ang = (20 + Math.random() * 30) * Math.PI / 180;
    const v = (700 + Math.random() * 600) * k;
    meteors.push({
      x: heading * FOCAL + SW * (0.1 + Math.random() * 0.8),
      y: CY * (0.05 + Math.random() * 0.45),
      vx: Math.cos(ang) * v * dir, vy: Math.sin(ang) * v,
      len: (90 + Math.random() * 120) * k,
      life: 0, max: 0.5 + Math.random() * 0.7,
      bright: Math.random() < 0.2 ? 1.0 : 0.7,
    });
  }
  function updateMeteors(dt) {
    nextMeteor -= dt;
    if (nextMeteor <= 0) { spawnMeteor(); nextMeteor = 15 + Math.random() * 30; }  // one every 15-45 seconds
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.life >= m.max || m.y > CY - 40) meteors.splice(i, 1);
    }
  }
  function drawMeteors() {
    const W = Math.ceil(WRAP);
    for (const m of meteors) {
      const hx = scrollX(m.x, W), hy = m.y;
      if (hx > SW + m.len) continue;
      const a = Math.sin(Math.PI * m.life / m.max) * m.bright;  // fades in and out over its short life
      const sp = Math.hypot(m.vx, m.vy);
      const tx = hx - m.vx / sp * m.len, ty = hy - m.vy / sp * m.len;
      const g = ctx.createLinearGradient(tx, ty, hx, hy);
      g.addColorStop(0, 'rgba(190,205,255,0)');
      g.addColorStop(1, 'rgba(240,245,255,0.9)');
      ctx.globalAlpha = a;
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
      glow(hx, hy, 1.1, C.star, a);
    }
  }

  // ---------------- Easter egg: a UFO made of lights (summoned by the Konami code) ----------------
  const UFO_T = 12.2;   // total screen time in seconds
  let ufo = null;
  function summonUfo() {
    ufo = {
      t: 0,
      dir: Math.random() < 0.5 ? 1 : -1,        // +1 = flies in from the left
      exitDir: Math.random() < 0.5 ? 1 : -1,
      hx: SW * (0.38 + Math.random() * 0.24),   // hover position
      drift: 0, lastHeading: heading,
    };
  }
  function updateUfo(dt) {
    if (!ufo) return;
    ufo.t += dt;
    // lag behind on curves like the background, then catch up with the car
    ufo.drift = (ufo.drift - (heading - ufo.lastHeading) * FOCAL) * Math.exp(-dt * 0.8);
    ufo.lastHeading = heading;
    if (ufo.t > UFO_T) ufo = null;
  }
  function drawUfo() {
    if (!ufo) return;
    const t = ufo.t, k = FOCAL / 960, hy = CY * 0.36;
    let x, y, tilt, s = 1, a = 1;
    if (t < 3) {                                   // arrive, leaning into the motion
      const x0 = ufo.dir > 0 ? -160 * k : SW + 160 * k;
      const p = smooth(t / 3);
      x = x0 + (ufo.hx - x0) * p;
      y = CY * 0.12 + (hy - CY * 0.12) * p;
      tilt = ufo.dir * 0.28 * (1 - p);
      a = clamp01(t / 0.6);
    } else {                                       // hover and wobble
      const h = t - 3;
      x = ufo.hx + Math.sin(h * 0.7) * 14 * k;
      y = hy + Math.sin(h * 1.7) * 6 * k;
      tilt = Math.sin(h * 1.3) * 0.06;
      if (t > 11) {                                // zip away into the sky
        const q = (t - 11) / (UFO_T - 11), q2 = q * q;
        x += ufo.exitDir * q2 * SW * 0.9;
        y -= q2 * CY * 0.8;
        tilt += ufo.exitDir * 0.35 * q;
        s = 1 - 0.65 * q;
        a = 1 - q2;
      }
    }
    x += ufo.drift;
    const R = 74 * k * s, dot = 2.3 * k * s;
    const cs = Math.cos(tilt), sn = Math.sin(tilt);
    const pt = (lx, ly) => { P.x = x + lx * cs - ly * sn; P.y = y + lx * sn + ly * cs; };

    // tractor beam down to the horizon, with sparkles drifting up
    const beam = clamp01((t - 4.5) / 0.6) * clamp01((9.5 - t) / 0.6) * a;
    const top = y + R * 0.2, bot = CY - 4;
    if (beam > 0 && bot > top) {
      const g = ctx.createLinearGradient(0, top, 0, bot);
      g.addColorStop(0, 'rgba(120,255,225,0.20)');
      g.addColorStop(1, 'rgba(120,255,225,0.03)');
      ctx.globalAlpha = beam;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x - R * 0.3, top); ctx.lineTo(x + R * 0.3, top);
      ctx.lineTo(x + R * 0.95, bot); ctx.lineTo(x - R * 0.95, bot);
      ctx.closePath(); ctx.fill();
      for (let i = 0; i < 28; i++) {
        const f = (rnd(i, 21) + t * (0.25 + rnd(i, 22) * 0.3)) % 1;   // 0 = ground, 1 = saucer
        const w = R * (0.3 + 0.65 * (1 - f));
        glow(x + (rnd(i, 23) * 2 - 1) * w * 0.85, bot - f * (bot - top),
             0.9, C.ufoC, beam * 0.8 * Math.sin(Math.PI * f));
      }
    }

    // faint glow under the hull
    pt(0, R * 0.12); glow(P.x, P.y, R * 0.12, C.ufoC, 0.18 * a);

    // upper hull outline (dim white points)
    for (let i = 0; i < 26; i++) {
      const th = i / 26 * Math.PI * 2;
      pt(Math.cos(th) * R * 0.8, -R * 0.07 + Math.sin(th) * R * 0.17);
      glow(P.x, P.y, dot * 0.55, C.white, (Math.sin(th) > 0 ? 0.45 : 0.2) * a);
    }

    // dome: rows of dim cyan points, with a blinking beacon on top
    for (const [sc, n] of [[1, 13], [0.72, 9], [0.42, 5]]) {
      for (let i = 0; i <= n; i++) {
        const th = Math.PI + i / n * Math.PI;
        pt(Math.cos(th) * R * 0.4 * sc, -R * 0.12 + Math.sin(th) * R * 0.36 * sc);
        glow(P.x, P.y, dot * 0.6, C.ufoC, 0.35 * a);
      }
    }
    pt(0, -R * 0.52);
    if (t % 1.0 < 0.5) glow(P.x, P.y, dot * 1.1, C.red, 0.9 * a);

    // rotating rim lights with a chasing highlight
    const N = 18, chase = Math.floor(t * 9);
    const cols = [C.ufoC, C.ufoM, C.ufoG];
    for (let i = 0; i < N; i++) {
      const th = i / N * Math.PI * 2 + t * 1.8;
      pt(Math.cos(th) * R, Math.sin(th) * R * 0.26);
      const front = Math.sin(th) > -0.1 ? 1 : 0.35;   // far side of the rim is dimmer
      const hot = (i + chase) % 6 === 0;
      glow(P.x, P.y, dot * (hot ? 1.5 : 1), cols[i % 3], (hot ? 1 : 0.7) * front * a);
    }

    // pulsing lights on the underside
    for (let i = 0; i < 3; i++) {
      const th = i / 3 * Math.PI * 2 - t * 1.2;
      pt(Math.cos(th) * R * 0.38, R * 0.15 + Math.sin(th) * R * 0.08);
      glow(P.x, P.y, dot * 1.2, C.ufoM, (0.5 + 0.4 * Math.sin(t * 6 + i * 2.1)) * a);
    }
  }

  // ---------------- Track lights ----------------
  function drawRow(spacing, onCount, cycle, lat, h, rad, col, inten, range) {
    for (let n = Math.ceil((trackS + 1) / spacing); ; n++) {
      const d = n * spacing - trackS;
      if (d > range || d >= MAXD) break;
      if (cycle > 0 && (((n % cycle) + cycle) % cycle) >= onCount) continue;
      if (!project(d, lat, h)) continue;
      glow(P.x, P.y, rad * P.sc, col, inten * fade(d, range));
    }
  }

  function groundPool(d, lat, radius, rgb, a) {
    if (a <= 0.004 || !project(d, lat, 0)) return;
    const rx = radius * P.sc;
    const ry = Math.max(1, rx * CAM_H / d);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, `rgba(${rgb},1)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.save();
    ctx.translate(P.x, P.y);
    ctx.scale(rx, ry);
    ctx.globalAlpha = a;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------- Railway infrastructure ----------------
  const RAIL_HALF_GAUGE = 0.5335;  // 1067 mm gauge
  const SLEEPER_HALF_WIDTH = 0.75; // 1500 mm overall sleeper width
  const MAIN_TRACK_LEFT = 0;
  const MAIN_TRACK_RIGHT = 4.1;
  const OUTER_TRACK_LEFT = -4.1;
  const OUTER_TRACK_RIGHT = 8.2;
  let quadrupleTrack = false;
  let trackModeTransition = null;

  // Station types repeat A / B / C: side-platform, terminal with sidings, and
  // island-platform. The four-track layout changes their platform placement,
  // while B always retains its branching sidings.
  const STATION_CYCLE = 1350;
  const STATION_START = 260;
  const STATION_END = 455;
  const STATION_TYPE_COUNT = 3;
  const STATION_TYPE_SIDE = 0;      // A: side-platform station
  const STATION_TYPE_TERMINAL = 1;  // B: terminal station with sidings
  const STATION_TYPE_ISLAND = 2;    // C: island-platform station
  const TURNOUT_LENGTH = 180;
  const TRACK_MODE_TRANSITION_LENGTH = 180;
  const TRACK_MODE_TRANSITION_AHEAD = 150;
  const TRACK_MODE_STATION_CLEARANCE = 55;
  const BLOCK_SIGNAL_SPACING = 235;
  const STOPPED_TRAIN_PROBABILITY = 0.30;
  const GG_SPEED_KMH = 131;
  const CATENARY_SPAN = 44;
  const DROPPER_SPACING = 11;
  const CONTACT_WIRE_H = 5.25;
  const MESSENGER_SUPPORT_H = 5.85;
  const MESSENGER_SAG = 0.28;
  const CONTACT_STAGGER = 0.125;
  const HOME_SIGNAL_MARGIN = 20;
  const HOME_MAIN_LAT = -1.9;
  const HOME_SIDING_LAT = -2.75;
  const SIDING_LEFT = -5.9;
  const SIDING_RIGHT = 10.0;
  const ISLAND_RIGHT_TRACK = 8.1;
  const QUAD_ISLAND_OUTER_LEFT = -8.1;
  const QUAD_ISLAND_OUTER_RIGHT = 12.2;
  const PLATFORMS = [
    { edge: -2.25, outer: -3.65, post: -3.35, lamp: -3.30, edgeLight: -2.18, outerLight: -3.72 },
    { edge:  6.35, outer:  7.75, post:  7.45, lamp:  7.40, edgeLight:  6.28, outerLight:  7.82 },
  ];
  const ISLAND_PLATFORM = {
    edge: 2.25, outer: 5.85, post: 4.05, lamp: 4.05, edgeLight: 2.18, outerLight: 5.92,
  };
  const QUAD_SIDE_PLATFORMS = [
    { edge: -6.35, outer: -7.75, post: -7.45, lamp: -7.40, edgeLight: -6.28, outerLight: -7.82 },
    { edge: 10.45, outer: 11.85, post: 11.55, lamp: 11.50, edgeLight: 10.38, outerLight: 11.92 },
  ];
  const QUAD_ISLAND_PLATFORMS = [
    { edge: -2.25, outer: -5.85, post: -4.05, lamp: -4.05, edgeLight: -2.18, outerLight: -5.92 },
    { edge:  6.35, outer:  9.95, post:  8.15, lamp:  8.15, edgeLight:  6.28, outerLight: 10.02 },
  ];

  const positiveMod = (n, m) => ((n % m) + m) % m;
  const isSideStation = index => positiveMod(index, STATION_TYPE_COUNT) === STATION_TYPE_SIDE;
  const isTerminalStation = index => positiveMod(index, STATION_TYPE_COUNT) === STATION_TYPE_TERMINAL;
  const isIslandStation = index => positiveMod(index, STATION_TYPE_COUNT) === STATION_TYPE_ISLAND;

  function quadrupleFactorAt(s) {
    if (!trackModeTransition) return quadrupleTrack ? 1 : 0;
    if (s <= trackModeTransition.start) return trackModeTransition.from ? 1 : 0;
    if (s >= trackModeTransition.end) return trackModeTransition.to ? 1 : 0;
    const t = smooth((s - trackModeTransition.start)
      / (trackModeTransition.end - trackModeTransition.start));
    return trackModeTransition.from ? 1 - t : t;
  }

  const isQuadrupleAt = s => quadrupleFactorAt(s) >= 0.5;
  const outerTrackVisibilityAt = s => smooth(Math.min(1, quadrupleFactorAt(s) * 3));

  function transitionOverlapsStation(start, end) {
    const firstIndex = Math.floor(start / STATION_CYCLE) - 1;
    const lastIndex = Math.floor(end / STATION_CYCLE) + 1;
    for (let stationIndex = firstIndex; stationIndex <= lastIndex; stationIndex++) {
      const base = stationIndex * STATION_CYCLE;
      const stationStart = base + STATION_START - TURNOUT_LENGTH - TRACK_MODE_STATION_CLEARANCE;
      const stationEnd = base + STATION_END + TURNOUT_LENGTH + TRACK_MODE_STATION_CLEARANCE;
      if (start < stationEnd && end > stationStart) return stationEnd;
    }
    return null;
  }

  function findTrackModeTransitionStart() {
    let start = trackS + TRACK_MODE_TRANSITION_AHEAD;
    for (let attempt = 0; attempt < 8; attempt++) {
      const blockedUntil = transitionOverlapsStation(start, start + TRACK_MODE_TRANSITION_LENGTH);
      if (blockedUntil === null) return start;
      start = blockedUntil + TRACK_MODE_STATION_CLEARANCE;
    }
    return start;
  }

  function homeSignalS(stationIndex) {
    return stationIndex * STATION_CYCLE + STATION_START - TURNOUT_LENGTH - HOME_SIGNAL_MARGIN;
  }

  function isNearTerminalHomeSignal(s, radius = BLOCK_SIGNAL_SPACING) {
    const nearestIndex = Math.floor(s / STATION_CYCLE);
    for (let stationIndex = nearestIndex - 1; stationIndex <= nearestIndex + 1; stationIndex++) {
      if (isTerminalStation(stationIndex) && Math.abs(s - homeSignalS(stationIndex)) <= radius)
        return true;
    }
    return false;
  }

  function stationShapeFactor(s, stationIndex, matchesType) {
    if (!matchesType(stationIndex)) return 0;
    const base = stationIndex * STATION_CYCLE;
    const platformStart = base + STATION_START;
    const platformEnd = base + STATION_END;
    const turnoutStart = platformStart - TURNOUT_LENGTH;
    const turnoutEnd = platformEnd + TURNOUT_LENGTH;
    if (s <= turnoutStart || s >= turnoutEnd) return 0;
    if (s < platformStart) return smooth((s - turnoutStart) / TURNOUT_LENGTH);
    if (s <= platformEnd) return 1;
    return smooth((turnoutEnd - s) / TURNOUT_LENGTH);
  }

  const sidingFactor = (s, stationIndex) => stationShapeFactor(s, stationIndex, isTerminalStation);
  const islandFactor = (s, stationIndex) => stationShapeFactor(s, stationIndex, isIslandStation);

  function terminalFactorAt(s) {
    const index = Math.floor(s / STATION_CYCLE);
    return sidingFactor(s, index);
  }

  function islandFactorAt(s) {
    const index = Math.floor(s / STATION_CYCLE);
    return islandFactor(s, index);
  }

  function rightMainCenterAt(s) {
    return MAIN_TRACK_RIGHT + (ISLAND_RIGHT_TRACK - MAIN_TRACK_RIGHT)
      * islandFactorAt(s) * (1 - quadrupleFactorAt(s));
  }

  function leftOuterTargetCenterAt(s) {
    const index = Math.floor(s / STATION_CYCLE);
    return OUTER_TRACK_LEFT
      + (SIDING_LEFT - OUTER_TRACK_LEFT) * sidingFactor(s, index)
      + (QUAD_ISLAND_OUTER_LEFT - OUTER_TRACK_LEFT) * islandFactor(s, index);
  }

  function rightOuterTargetCenterAt(s) {
    const index = Math.floor(s / STATION_CYCLE);
    return OUTER_TRACK_RIGHT
      + (SIDING_RIGHT - OUTER_TRACK_RIGHT) * sidingFactor(s, index)
      + (QUAD_ISLAND_OUTER_RIGHT - OUTER_TRACK_RIGHT) * islandFactor(s, index);
  }

  function leftOuterCenterAt(s) {
    const q = quadrupleFactorAt(s);
    return MAIN_TRACK_LEFT + (leftOuterTargetCenterAt(s) - MAIN_TRACK_LEFT) * q;
  }

  function rightOuterCenterAt(s) {
    const q = quadrupleFactorAt(s);
    return MAIN_TRACK_RIGHT + (rightOuterTargetCenterAt(s) - MAIN_TRACK_RIGHT) * q;
  }

  function sidingCenter(s, mainCenter, outerCenter, stationIndex) {
    return mainCenter + (outerCenter - mainCenter) * sidingFactor(s, stationIndex);
  }

  function messengerHeightAt(s) {
    const phase = positiveMod(s, CATENARY_SPAN) / CATENARY_SPAN;
    return MESSENGER_SUPPORT_H - MESSENGER_SAG * 4 * phase * (1 - phase);
  }

  function catenaryStaggerAt(s) {
    const spanIndex = Math.floor(s / CATENARY_SPAN);
    const phase = positiveMod(s, CATENARY_SPAN) / CATENARY_SPAN;
    const supportOffset = positiveMod(spanIndex, 2) === 0 ? -CONTACT_STAGGER : CONTACT_STAGGER;
    return supportOffset * (1 - 2 * phase);
  }

  function worldSegment(d1, lat1, h1, d2, lat2, h2, color, width, alpha) {
    if (!project(d1, lat1, h1)) return;
    const x1 = P.x, y1 = P.y;
    if (!project(d2, lat2, h2)) return;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(P.x, P.y); ctx.stroke();
  }

  function worldCurve(lat, h, near, far, step, color, width, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    let started = false;
    for (let d = near; d <= far; d += step) {
      if (!project(d, lat, h)) continue;
      if (!started) { ctx.moveTo(P.x, P.y); started = true; }
      else ctx.lineTo(P.x, P.y);
    }
    if (started) ctx.stroke();
  }

  function worldVariableCurve(latAt, h, near, far, step, color, width, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    let started = false;
    for (let d = near; d <= far; d += step) {
      if (!project(d, latAt(trackS + d), h)) continue;
      if (!started) { ctx.moveTo(P.x, P.y); started = true; }
      else ctx.lineTo(P.x, P.y);
    }
    if (started) ctx.stroke();
  }

  function worldSpatialCurve(latAt, heightAt, near, far, step, color, width, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    let started = false;
    for (let d = near; d <= far; d += step) {
      const s = trackS + d;
      if (!project(d, latAt(s), heightAt(s))) continue;
      if (!started) { ctx.moveTo(P.x, P.y); started = true; }
      else ctx.lineTo(P.x, P.y);
    }
    if (started) ctx.stroke();
  }

  function worldWeightedSpatialCurve(latAt, heightAt, weightAt, near, far, step, color, width, alpha) {
    for (let d1 = near; d1 < far; d1 += step) {
      const d2 = Math.min(far, d1 + step);
      const s1 = trackS + d1, s2 = trackS + d2;
      const weight = (weightAt(s1) + weightAt(s2)) * 0.5;
      if (weight < 0.01) continue;
      worldSegment(d1, latAt(s1), heightAt(s1), d2, latAt(s2), heightAt(s2),
                   color, width, alpha * weight);
    }
  }

  function drawCatenaryDroppers(latAt, near, far, alpha, factorAt = null) {
    for (let n = Math.ceil((trackS + near) / DROPPER_SPACING); ; n++) {
      const s = n * DROPPER_SPACING;
      const d = s - trackS;
      if (d > far || d >= MAXD) break;
      const factor = factorAt ? factorAt(s) : 1;
      if (factor < 0.015) continue;
      const lat = latAt(s);
      worldSegment(d, lat, CONTACT_WIRE_H, d, lat, messengerHeightAt(s),
                   'rgb(115,140,170)', 0.55, alpha * factor * fade(d, 560));
    }
  }

  function drawSleepers(center, range) {
    const SPACING = 0.78;
    for (let n = Math.ceil((trackS + 2) / SPACING); ; n++) {
      const d = n * SPACING - trackS;
      if (d > range) break;
      const a = 0.20 + 0.38 * fade(d, range);
      worldSegment(d, center - SLEEPER_HALF_WIDTH, 0.025, d, center + SLEEPER_HALF_WIDTH, 0.025,
                   'rgb(155,165,185)', Math.max(0.45, 1.5 * FOCAL / d / 35), a);
    }
  }

  function drawVariableSleepers(centerAt, range, factorAt = null) {
    const spacing = 0.78;
    for (let n = Math.ceil((trackS + 2) / spacing); ; n++) {
      const s = n * spacing;
      const d = s - trackS;
      if (d > range) break;
      const factor = factorAt ? factorAt(s) : 1;
      if (factor < 0.015) continue;
      const center = centerAt(s);
      const a = (0.20 + 0.38 * fade(d, range)) * factor;
      worldSegment(d, center - SLEEPER_HALF_WIDTH, 0.025,
                   d, center + SLEEPER_HALF_WIDTH, 0.025,
                   'rgb(155,165,185)', Math.max(0.45, 1.5 * FOCAL / d / 35), a);
    }
  }

  function drawVariableRow(spacing, latAt, h, rad, col, inten, range, factorAt = null) {
    for (let n = Math.ceil((trackS + 1) / spacing); ; n++) {
      const s = n * spacing;
      const d = s - trackS;
      if (d > range || d >= MAXD) break;
      const factor = factorAt ? factorAt(s) : 1;
      if (factor < 0.015) continue;
      if (!project(d, latAt(s), h)) continue;
      glow(P.x, P.y, rad * P.sc, col, inten * factor * fade(d, range));
    }
  }

  function drawTurnoutConnector(startS, endS, fromAt, toAt, alpha) {
    const near = Math.max(2, startS - trackS);
    const far = Math.min(MAXD - 1, endS - trackS);
    if (near >= far) return;
    const centerAt = s => {
      const t = smooth((s - startS) / (endS - startS));
      return fromAt(s) + (toAt(s) - fromAt(s)) * t;
    };

    for (const railOffset of [-RAIL_HALF_GAUGE, RAIL_HALF_GAUGE]) {
      worldVariableCurve(s => centerAt(s) + railOffset, 0.065, near, far, 1.2,
                         'rgb(205,220,245)', 1.2, alpha);
    }
    for (let s = Math.ceil((trackS + near) / 1.05) * 1.05; s < trackS + far; s += 1.05) {
      const d = s - trackS;
      const center = centerAt(s);
      worldSegment(d, center - SLEEPER_HALF_WIDTH, 0.03,
                   d, center + SLEEPER_HALF_WIDTH, 0.03,
                   'rgb(155,165,185)', Math.max(0.45, 1.35 * FOCAL / d / 35), alpha * 0.58);
    }
  }

  function drawTerminalCrossovers(stationIndex) {
    const base = stationIndex * STATION_CYCLE;
    const routeStart = base + STATION_START - TURNOUT_LENGTH;
    const routeEnd = base + STATION_END + TURNOUT_LENGTH;
    const offset = 18;
    const length = 96;
    const leftOuterAt = s => leftOuterCenterAt(s);
    const rightOuterAt = s => rightOuterCenterAt(s);
    const leftMainAt = () => MAIN_TRACK_LEFT;
    const rightMainAt = () => MAIN_TRACK_RIGHT;

    // Entry and exit connections keep B as a four-track station while making
    // the route between the inner and outer lines visibly selectable.
    drawTurnoutConnector(routeStart + offset, routeStart + offset + length,
                         leftMainAt, leftOuterAt, 0.54);
    drawTurnoutConnector(routeStart + offset, routeStart + offset + length,
                         rightMainAt, rightOuterAt, 0.40);
    drawTurnoutConnector(routeEnd - offset - length, routeEnd - offset,
                         leftOuterAt, leftMainAt, 0.50);
    drawTurnoutConnector(routeEnd - offset - length, routeEnd - offset,
                         rightOuterAt, rightMainAt, 0.36);
  }

  function drawTerminalStationTracks() {
    const firstIndex = Math.floor(trackS / STATION_CYCLE) - 1;
    const lastIndex = Math.floor((trackS + MAXD) / STATION_CYCLE) + 1;
    const sleeperSpacing = 0.78;
    const reflectorSpacing = 2.2;

    for (let stationIndex = firstIndex; stationIndex <= lastIndex; stationIndex++) {
      if (!isTerminalStation(stationIndex)) continue;
      const base = stationIndex * STATION_CYCLE;
      const routeStart = base + STATION_START - TURNOUT_LENGTH;
      const routeEnd = base + STATION_END + TURNOUT_LENGTH;
      const stationQuadruple = isQuadrupleAt(base + (STATION_START + STATION_END) * 0.5);
      const near = Math.max(2, routeStart - trackS);
      const far = Math.min(MAXD - 1, routeEnd - trackS);
      if (near >= far) continue;

      if (stationQuadruple) {
        drawTerminalCrossovers(stationIndex);
        continue;
      }

      const routes = [
        { main: MAIN_TRACK_LEFT, outer: SIDING_LEFT, alpha: 0.52 },
        { main: MAIN_TRACK_RIGHT, outer: SIDING_RIGHT, alpha: 0.34 },
      ];

      for (const route of routes) {
        const centerAt = s => sidingCenter(s, route.main, route.outer, stationIndex);
        const catenaryAt = s => centerAt(s) + catenaryStaggerAt(s);
        for (const railOffset of [-RAIL_HALF_GAUGE, RAIL_HALF_GAUGE]) {
          worldVariableCurve(s => centerAt(s) + railOffset, 0.06, near, far, 1.7,
                             'rgb(185,205,235)', 1.15, route.alpha);
        }
        worldVariableCurve(catenaryAt, CONTACT_WIRE_H, near, far, 2.5,
                           'rgb(135,165,200)', 0.65, route.alpha * 0.65);
        worldSpatialCurve(catenaryAt, messengerHeightAt, near, far, 2.0,
                          'rgb(100,125,155)', 0.55, route.alpha * 0.42);
        drawCatenaryDroppers(catenaryAt, near, far, route.alpha * 0.36,
                             s => sidingFactor(s, stationIndex));

        for (let n = Math.ceil((trackS + near) / sleeperSpacing); ; n++) {
          const s = n * sleeperSpacing;
          const d = s - trackS;
          if (d > far) break;
          const f = sidingFactor(s, stationIndex);
          if (f < 0.015) continue;
          const center = centerAt(s);
          const a = (0.18 + 0.30 * fade(d, MAXD)) * f;
          worldSegment(d, center - SLEEPER_HALF_WIDTH, 0.025,
                       d, center + SLEEPER_HALF_WIDTH, 0.025,
                       'rgb(145,155,175)', Math.max(0.42, 1.35 * FOCAL / d / 35), a);
        }

        for (let n = Math.ceil((trackS + near) / reflectorSpacing); ; n++) {
          const s = n * reflectorSpacing;
          const d = s - trackS;
          if (d > far || d > 220) break;
          const f = sidingFactor(s, stationIndex);
          if (f < 0.04) continue;
          const center = centerAt(s);
          for (const railOffset of [-RAIL_HALF_GAUGE, RAIL_HALF_GAUGE]) {
            if (project(d, center + railOffset, 0.08))
              glow(P.x, P.y, 0.032 * P.sc, C.refW, 0.42 * f * fade(d, 220));
          }
        }
      }
    }
  }

  function drawSignal(n, d, lat) {
    // Four-lamp type B: ordinary running shows 80% G / 20% YG. At a
    // displayed speed of 131 km/h or more, the upper and lower lamps both
    // turn green as the hidden high-speed GG aspect.
    const isGG = Math.round(speed * 3.6) >= GG_SPEED_KMH;
    const isYG = !isGG && rnd(n, 86) < 0.20;
    const headScale = 0.75;
    const headCenter = 3.95;
    const lamps = [0.60, 0.20, -0.20, -0.60].map(offset => headCenter + offset * headScale);
    const a = fade(d, 560);

    worldSegment(d, lat, 0.1, d, lat, 4.8, 'rgb(125,145,165)', Math.max(0.7, P.sc * 0.025), 0.48 * fade(d, 520));
    worldSegment(d, lat - 0.35, 4.75, d, lat + 0.35, 4.75, 'rgb(145,165,185)', 1, 0.42 * fade(d, 520));

    // Black backboard and four dark lenses make the aspect legible nearby.
    // The rest of the scene uses additive blending, so switch briefly for
    // opaque signal hardware and restore it before drawing the lit aspects.
    ctx.globalCompositeOperation = 'source-over';
    if (project(d, lat, headCenter)) {
      const sc = P.sc;
      const w = Math.max(1.4, 0.42 * headScale * sc);
      const h = Math.max(4.5, 1.72 * headScale * sc);
      ctx.globalAlpha = 0.82 * a;
      ctx.fillStyle = 'rgb(9,14,18)';
      ctx.beginPath();
      ctx.roundRect(P.x - w / 2, P.y - h / 2, w, h, Math.min(w / 2, 0.18 * sc));
      ctx.fill();
    }
    for (const h of lamps) {
      if (!project(d, lat, h)) continue;
      ctx.globalAlpha = 0.72 * a;
      ctx.fillStyle = 'rgb(34,43,47)';
      ctx.beginPath();
      ctx.arc(P.x, P.y, Math.max(0.45, 0.08 * P.sc), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';

    if ((isGG || isYG) && project(d, lat, lamps[0]))
      glow(P.x, P.y, 0.105 * P.sc, isGG ? C.signalG : C.signalY, 0.96 * a);
    if (project(d, lat, lamps[3]))
      glow(P.x, P.y, 0.105 * P.sc, C.signalG, 0.96 * a);
  }

  function drawSidingHomeSignal(d, lat) {
    // The siding route is a lower three-lamp head held permanently at stop.
    // Lens and glow sizes match the adjacent main-route signal.
    const headScale = 0.75;
    const headCenter = 3.55;
    const lamps = [0.40, 0, -0.40].map(offset => headCenter + offset * headScale);
    const a = fade(d, 560);

    worldSegment(d, lat, 0.1, d, lat, 4.35, 'rgb(125,145,165)', Math.max(0.7, P.sc * 0.025), 0.48 * fade(d, 520));
    worldSegment(d, lat - 0.30, 4.30, d, lat + 0.30, 4.30, 'rgb(145,165,185)', 1, 0.42 * fade(d, 520));

    ctx.globalCompositeOperation = 'source-over';
    if (project(d, lat, headCenter)) {
      const sc = P.sc;
      const w = Math.max(1.4, 0.42 * headScale * sc);
      const h = Math.max(3.5, 1.20 * headScale * sc);
      ctx.globalAlpha = 0.82 * a;
      ctx.fillStyle = 'rgb(9,14,18)';
      ctx.beginPath();
      ctx.roundRect(P.x - w / 2, P.y - h / 2, w, h, Math.min(w / 2, 0.18 * sc));
      ctx.fill();
    }
    for (const h of lamps) {
      if (!project(d, lat, h)) continue;
      ctx.globalAlpha = 0.72 * a;
      ctx.fillStyle = 'rgb(34,43,47)';
      ctx.beginPath();
      ctx.arc(P.x, P.y, Math.max(0.45, 0.08 * P.sc), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'lighter';

    if (project(d, lat, lamps[2]))
      glow(P.x, P.y, 0.105 * P.sc, C.red, 0.96 * a);
  }

  function drawTerminalHomeSignals() {
    const firstIndex = Math.floor(trackS / STATION_CYCLE) - 1;
    const lastIndex = Math.floor((trackS + MAXD) / STATION_CYCLE) + 1;
    for (let stationIndex = firstIndex; stationIndex <= lastIndex; stationIndex++) {
      if (!isTerminalStation(stationIndex)) continue;
      const d = homeSignalS(stationIndex) - trackS;
      if (d <= 1 || d >= MAXD) continue;
      drawSignal(stationIndex * 101 + 17, d, HOME_MAIN_LAT);
      drawSidingHomeSignal(d, HOME_SIDING_LAT);
    }
  }

  function drawStation() {
    const base = Math.floor(trackS / STATION_CYCLE) * STATION_CYCLE;
    for (let b = base - STATION_CYCLE; b <= trackS + MAXD; b += STATION_CYCLE) {
      const stationIndex = Math.round(b / STATION_CYCLE);
      const terminal = isTerminalStation(stationIndex);
      const island = isIslandStation(stationIndex);
      const stationQuadruple = isQuadrupleAt(b + (STATION_START + STATION_END) * 0.5);
      const stationPlatforms = stationQuadruple
        ? (island ? QUAD_ISLAND_PLATFORMS : terminal ? PLATFORMS : QUAD_SIDE_PLATFORMS)
        : (island ? [ISLAND_PLATFORM] : PLATFORMS);
      const doubleSided = terminal || island;
      const ds = b + STATION_START - trackS, de = b + STATION_END - trackS;
      if (de < 2 || ds > MAXD) continue;
      const near = Math.max(2, ds), far = Math.min(MAXD - 1, de);
      for (const platform of stationPlatforms) {
        worldCurve(platform.edge, 0.62, near, far, 3, 'rgb(200,205,215)', 1.3, 0.36);
        worldCurve(platform.outer, 0.62, near, far, 3,
                   doubleSided ? 'rgb(190,200,215)' : 'rgb(110,125,150)',
                   doubleSided ? 1.25 : 1.0, doubleSided ? 0.34 : 0.22);
        worldCurve(platform.post, 3.42, near, far, 4, 'rgb(100,120,145)', 0.7, 0.18);
        for (let s = Math.ceil((trackS + near) / 7) * 7; s < trackS + far; s += 7) {
          const d = s - trackS;
          worldSegment(d, platform.post, 0.6, d, platform.post, 3.4,
                       'rgb(105,125,150)', 0.8, 0.28 * fade(d, 500));
          if (project(d, platform.lamp, 3.25))
            glow(P.x, P.y, 0.16 * P.sc, C.white, 0.75 * fade(d, 520));
          if (project(d, platform.edgeLight, 0.72))
            glow(P.x, P.y, 0.045 * P.sc, C.cyan, 0.65 * fade(d, 420));
          if (doubleSided && project(d, platform.outerLight, 0.72))
            glow(P.x, P.y, 0.045 * P.sc, C.cyan, 0.52 * fade(d, 420));
        }
      }
    }
  }

  function drawRailway() {
    // A cool, narrow pool of cab light over the ballast.
    groundPool(15, 0, 4.2, '205,225,255', 0.045);
    groundPool(34, 0, 6.0, '205,225,255', 0.022);
    const outerModeVisible = quadrupleTrack || !!trackModeTransition;

    // Our main track stays fixed. The opposing main track moves outward only
    // through island-platform stations, leaving room for the center platform.
    for (const railOffset of [-RAIL_HALF_GAUGE, RAIL_HALF_GAUGE]) {
      worldCurve(MAIN_TRACK_LEFT + railOffset, 0.06, 2, MAXD - 1, 2.5,
                 'rgb(185,205,235)', 1.15, 0.64);
      drawRow(2.2, 0, 0, MAIN_TRACK_LEFT + railOffset, 0.08, 0.035, C.refW, 0.72, 220);
      worldVariableCurve(s => rightMainCenterAt(s) + railOffset, 0.06, 2, MAXD - 1, 2.0,
                         'rgb(185,205,235)', 1.15, 0.36);
      drawVariableRow(2.2, s => rightMainCenterAt(s) + railOffset,
                      0.08, 0.035, C.refW, 0.36, 220);
      if (trackModeTransition) {
        worldWeightedSpatialCurve(s => leftOuterCenterAt(s) + railOffset, () => 0.06,
                                  outerTrackVisibilityAt, 2, MAXD - 1, 1.8,
                                  'rgb(165,190,225)', 1.05, 0.34);
        worldWeightedSpatialCurve(s => rightOuterCenterAt(s) + railOffset, () => 0.06,
                                  outerTrackVisibilityAt, 2, MAXD - 1, 1.8,
                                  'rgb(165,190,225)', 1.05, 0.28);
      } else if (quadrupleTrack) {
        worldVariableCurve(s => leftOuterCenterAt(s) + railOffset, 0.06, 2, MAXD - 1, 2.0,
                           'rgb(165,190,225)', 1.05, 0.34);
        worldVariableCurve(s => rightOuterCenterAt(s) + railOffset, 0.06, 2, MAXD - 1, 2.0,
                           'rgb(165,190,225)', 1.05, 0.28);
      }
      if (outerModeVisible) {
        const factorAt = trackModeTransition ? outerTrackVisibilityAt : null;
        drawVariableRow(2.2, s => leftOuterCenterAt(s) + railOffset,
                        0.08, 0.032, C.refW, 0.34, 200, factorAt);
        drawVariableRow(2.2, s => rightOuterCenterAt(s) + railOffset,
                        0.08, 0.032, C.refO, 0.27, 200, factorAt);
      }
    }
    drawTerminalStationTracks();
    drawSleepers(MAIN_TRACK_LEFT, 145);
    drawVariableSleepers(rightMainCenterAt, 105);
    if (outerModeVisible) {
      const factorAt = trackModeTransition ? outerTrackVisibilityAt : null;
      drawVariableSleepers(leftOuterCenterAt, 105, factorAt);
      drawVariableSleepers(rightOuterCenterAt, 95, factorAt);
    }
    drawRow(14, 0, 0, -1.55, 0.35, 0.045, C.refW, 0.48, 360);
    drawVariableRow(14, s => rightMainCenterAt(s) + 1.55,
                    0.35, 0.045, C.refO, 0.30, 300);

    // Simple catenary: level contact wires, sagging messenger wires, and
    // regular droppers create a recognizable overhead-line profile.
    const leftCatenaryAt = s => MAIN_TRACK_LEFT + catenaryStaggerAt(s);
    const rightCatenaryAt = s => rightMainCenterAt(s) + catenaryStaggerAt(s);
    const leftOuterCatenaryAt = s => leftOuterCenterAt(s) + catenaryStaggerAt(s);
    const rightOuterCatenaryAt = s => rightOuterCenterAt(s) + catenaryStaggerAt(s);
    worldVariableCurve(leftCatenaryAt, CONTACT_WIRE_H, 3, MAXD - 1, 2.5,
                       'rgb(135,165,200)', 0.75, 0.34);
    worldVariableCurve(rightCatenaryAt, CONTACT_WIRE_H, 3, MAXD - 1, 2.5,
                       'rgb(135,165,200)', 0.65, 0.24);
    worldSpatialCurve(leftCatenaryAt, messengerHeightAt, 3, MAXD - 1, 2.0,
                      'rgb(100,125,155)', 0.60, 0.26);
    worldSpatialCurve(rightCatenaryAt, messengerHeightAt, 3, MAXD - 1, 2.0,
                      'rgb(100,125,155)', 0.55, 0.18);
    drawCatenaryDroppers(leftCatenaryAt, 3, MAXD - 1, 0.24);
    drawCatenaryDroppers(rightCatenaryAt, 3, MAXD - 1, 0.17);
    if (trackModeTransition) {
      worldWeightedSpatialCurve(leftOuterCatenaryAt, () => CONTACT_WIRE_H,
                                outerTrackVisibilityAt, 3, MAXD - 1, 2.3,
                                'rgb(125,155,190)', 0.62, 0.22);
      worldWeightedSpatialCurve(rightOuterCatenaryAt, () => CONTACT_WIRE_H,
                                outerTrackVisibilityAt, 3, MAXD - 1, 2.3,
                                'rgb(125,155,190)', 0.58, 0.18);
      worldWeightedSpatialCurve(leftOuterCatenaryAt, messengerHeightAt,
                                outerTrackVisibilityAt, 3, MAXD - 1, 2.0,
                                'rgb(90,115,145)', 0.52, 0.17);
      worldWeightedSpatialCurve(rightOuterCatenaryAt, messengerHeightAt,
                                outerTrackVisibilityAt, 3, MAXD - 1, 2.0,
                                'rgb(90,115,145)', 0.50, 0.14);
    } else if (quadrupleTrack) {
      worldVariableCurve(leftOuterCatenaryAt, CONTACT_WIRE_H, 3, MAXD - 1, 2.5,
                         'rgb(125,155,190)', 0.62, 0.22);
      worldVariableCurve(rightOuterCatenaryAt, CONTACT_WIRE_H, 3, MAXD - 1, 2.5,
                         'rgb(125,155,190)', 0.58, 0.18);
      worldSpatialCurve(leftOuterCatenaryAt, messengerHeightAt, 3, MAXD - 1, 2.0,
                        'rgb(90,115,145)', 0.52, 0.17);
      worldSpatialCurve(rightOuterCatenaryAt, messengerHeightAt, 3, MAXD - 1, 2.0,
                        'rgb(90,115,145)', 0.50, 0.14);
    }
    if (outerModeVisible) {
      const factorAt = trackModeTransition ? outerTrackVisibilityAt : null;
      drawCatenaryDroppers(leftOuterCatenaryAt, 3, MAXD - 1, 0.16, factorAt);
      drawCatenaryDroppers(rightOuterCatenaryAt, 3, MAXD - 1, 0.13, factorAt);
    }

    const GANTRY_LEFT = -2.25, GANTRY_RIGHT = 6.35;
    const PASSING_GANTRY_LEFT = SIDING_LEFT - 2.25;
    const PASSING_GANTRY_RIGHT = SIDING_RIGHT + 2.25;
    const ISLAND_GANTRY_RIGHT = ISLAND_RIGHT_TRACK + 2.25;
    for (let n = Math.ceil((trackS + 1) / CATENARY_SPAN); ; n++) {
      const s = n * CATENARY_SPAN;
      const d = s - trackS;
      if (d >= MAXD) break;
      const a = 0.42 * fade(d, 560);
      const passing = terminalFactorAt(s);
      const island = islandFactorAt(s);
      const q = quadrupleFactorAt(s);
      const doubleLeftPole = GANTRY_LEFT + (PASSING_GANTRY_LEFT - GANTRY_LEFT) * passing;
      const doubleRightPole = GANTRY_RIGHT
        + (PASSING_GANTRY_RIGHT - GANTRY_RIGHT) * passing
        + (ISLAND_GANTRY_RIGHT - GANTRY_RIGHT) * island;
      const quadrupleLeftPole = leftOuterTargetCenterAt(s) - 2.25;
      const quadrupleRightPole = rightOuterTargetCenterAt(s) + 2.25;
      const leftPole = doubleLeftPole + (quadrupleLeftPole - doubleLeftPole) * q;
      const rightPole = doubleRightPole + (quadrupleRightPole - doubleRightPole) * q;
      const leftSidingCenter = MAIN_TRACK_LEFT + (SIDING_LEFT - MAIN_TRACK_LEFT) * passing;
      const rightSidingCenter = MAIN_TRACK_RIGHT + (SIDING_RIGHT - MAIN_TRACK_RIGHT) * passing;
      const rightMainCenter = rightMainCenterAt(s);
      const stagger = catenaryStaggerAt(s);
      const leftContact = MAIN_TRACK_LEFT + stagger;
      const rightContact = rightMainCenter + stagger;
      const leftSidingContact = leftSidingCenter + stagger;
      const rightSidingContact = rightSidingCenter + stagger;
      const leftOuterContact = leftOuterCenterAt(s) + stagger;
      const rightOuterContact = rightOuterCenterAt(s) + stagger;

      // Portal gantries widen with passing sidings or the displaced island track.
      worldSegment(d, leftPole, 0.1, d, leftPole, 6.4, 'rgb(110,135,165)', 1.0, a);
      worldSegment(d, rightPole, 0.1, d, rightPole, 6.4, 'rgb(110,135,165)', 1.0, a);
      worldSegment(d, leftPole, 6.1, d, rightPole, 6.1, 'rgb(110,135,165)', 0.9, a * 0.85);
      worldSegment(d, leftPole, 5.45, d, leftPole + 0.72, 6.1, 'rgb(100,125,155)', 0.75, a * 0.72);
      worldSegment(d, rightPole, 5.45, d, rightPole - 0.72, 6.1, 'rgb(100,125,155)', 0.75, a * 0.72);
      worldSegment(d, leftContact, 6.1, d, leftContact, MESSENGER_SUPPORT_H,
                   'rgb(135,155,180)', 0.7, a);
      worldSegment(d, rightContact, 6.1, d, rightContact, MESSENGER_SUPPORT_H,
                   'rgb(135,155,180)', 0.7, a);
      if (q > 0.015) {
        worldSegment(d, leftOuterContact, 6.1, d, leftOuterContact, MESSENGER_SUPPORT_H,
                     'rgb(135,155,180)', 0.65, a * outerTrackVisibilityAt(s));
        worldSegment(d, rightOuterContact, 6.1, d, rightOuterContact, MESSENGER_SUPPORT_H,
                     'rgb(135,155,180)', 0.65, a * outerTrackVisibilityAt(s));
      }
      if (q < 0.985 && passing > 0.015) {
        worldSegment(d, leftSidingContact, 6.1, d, leftSidingContact, MESSENGER_SUPPORT_H,
                     'rgb(135,155,180)', 0.65, a * passing * (1 - q));
        worldSegment(d, rightSidingContact, 6.1, d, rightSidingContact, MESSENGER_SUPPORT_H,
                     'rgb(135,155,180)', 0.65, a * passing * (1 - q));
      }
      if (project(d, leftPole, 5.7)) glow(P.x, P.y, 0.045 * P.sc, C.cyan, 0.44 * fade(d, 500));
      if (project(d, rightPole, 5.7)) glow(P.x, P.y, 0.045 * P.sc, C.cyan, 0.32 * fade(d, 500));
    }

    // Keep the nearest signal until it actually reaches the cab. Starting the
    // sequence at +28 m made it vanish noticeably before the viewpoint.
    for (let n = Math.ceil((trackS + 1) / BLOCK_SIGNAL_SPACING); ; n++) {
      const s = n * BLOCK_SIGNAL_SPACING;
      const d = s - trackS;
      if (d >= MAXD) break;
      // Reserve one complete block-signal interval on both sides of each
      // paired home signal; every signal outside that zone stays unchanged.
      if (!isNearTerminalHomeSignal(s)) drawSignal(n, d, HOME_MAIN_LAT);
    }
    drawTerminalHomeSignals();
    drawStation();
  }

  // ---------------- Other trains ----------------
  const trains = [
    { s: trackS + 430, v: -31, cars: 9 },
  ];

  function respawnTrain(t, initial) {
    t.v = -(27 + Math.random() * 9);
    t.s = trackS + (initial ? 180 + Math.random() * 430 : MAXD + 260 + Math.random() * 500);
    t.cars = 7 + rand(4);
  }

  function updateTrains(dt) {
    for (const t of trains) {
      t.s += t.v * dt;
      const d = t.s - trackS;
      if (d < -t.cars * 20 - 20) respawnTrain(t, false);
    }
  }

  function drawTrainWindows(d, centerAt, cars, intensity) {
    for (let car = 0; car < cars; car++) {
      const dc = d + car * 19;
      if (dc < 2 || dc >= MAXD) continue;
      for (const along of [-5.5, -2.5, 0.5, 3.5, 6.5]) {
        const dw = dc + along;
        if (dw < 2 || dw >= MAXD) continue;
        const center = centerAt(trackS + dw);
        for (const edge of [-0.88, 0.88]) {
          if (project(dw, center + edge, 1.75))
            glow(P.x, P.y, 0.055 * P.sc, C.cyan, intensity * fade(dw, MAXD));
        }
      }
      if (project(dc, centerAt(trackS + dc), 3.15))
        glow(P.x, P.y, 0.035 * P.sc, C.white, 0.22 * intensity * fade(dc, MAXD));
    }
  }

  function drawStoppedTrain(stationIndex, mainCenter, sidingCenterLat, opposing, salt) {
    if (rnd(stationIndex, salt) >= STOPPED_TRAIN_PROBABILITY) return;

    const base = stationIndex * STATION_CYCLE;
    const cars = 7 + Math.floor(rnd(stationIndex, salt + 1) * 3);
    const trainS = base + STATION_START + 12;
    const nearD = trainS - trackS;
    const farD = trainS + cars * 19 - trackS;
    if (farD < 2 || nearD >= MAXD) return;

    const centerAt = s => sidingCenter(s, mainCenter, sidingCenterLat, stationIndex);
    drawTrainWindows(nearD + 8, centerAt, cars, 0.50);

    // The near end faces the cab: opposing trains show three white lamps,
    // while trains in our direction show their red tail lamps.
    if (nearD < 2 || nearD >= MAXD) return;
    const center = centerAt(trainS);
    const a = fade(nearD, MAXD);
    if (opposing) {
      for (const k of [-1, 1]) {
        if (project(nearD, center + 0.58 * k, 1.25))
          glow(P.x, P.y, 0.15 * P.sc, C.head, 0.92 * a);
      }
      if (project(nearD, center, 2.55))
        glow(P.x, P.y, 0.070 * P.sc, C.head, 0.50 * a);
    } else {
      for (const k of [-1, 1]) {
        if (project(nearD, center + 0.52 * k, 1.18))
          glow(P.x, P.y, 0.105 * P.sc, C.tail, 0.92 * a);
      }
      if (project(nearD, center, 2.45))
        glow(P.x, P.y, 0.043 * P.sc, C.red, 0.40 * a);
    }
  }

  function drawStoppedTrains() {
    const firstIndex = Math.floor((trackS - STATION_END) / STATION_CYCLE) - 1;
    const lastIndex = Math.floor((trackS + MAXD) / STATION_CYCLE) + 1;
    for (let stationIndex = firstIndex; stationIndex <= lastIndex; stationIndex++) {
      if (!isTerminalStation(stationIndex)) continue;
      const stationS = stationIndex * STATION_CYCLE + (STATION_START + STATION_END) * 0.5;
      const stationQuadruple = isQuadrupleAt(stationS);
      // Each direction is decided independently, so a station may contain no
      // stopped train, one train, or trains on both outer sidings.
      drawStoppedTrain(stationIndex, stationQuadruple ? OUTER_TRACK_LEFT : MAIN_TRACK_LEFT,
                       SIDING_LEFT,
                       false, 301);
      drawStoppedTrain(stationIndex, stationQuadruple ? OUTER_TRACK_RIGHT : MAIN_TRACK_RIGHT,
                       SIDING_RIGHT,
                       true, 303);
    }
  }

  function drawTrains() {
    for (const t of trains) {
      const d = t.s - trackS;
      const tailD = d + t.cars * 19 - 4.5;
      // An opposing train's nose passes first. Keep drawing the carriages
      // until the back of the last car has also gone behind the cab.
      if (tailD < 2 || d >= MAXD) continue;
      const center = rightMainCenterAt(t.s);
      drawTrainWindows(d + 8, rightMainCenterAt, t.cars, 0.58);
      if (d >= 2) {
        for (const k of [-1, 1]) {
          if (project(d, center + 0.58 * k, 1.25)) glow(P.x, P.y, 0.16 * P.sc, C.head, 1.0 * fade(d, MAXD));
        }
        if (project(d, center, 2.55))
          glow(P.x, P.y, 0.075 * P.sc, C.head, 0.55 * fade(d, 500));
        if (d < 100 && project(d, center, 1.35)) glow(P.x, P.y, 1.25 * P.sc, C.head, 0.22 * (1 - d / 100));
      } else {
        // Once the nose has passed the cab, the rear face becomes visible.
        const rearD = d + t.cars * 19 - 1.5;
        const rearCenter = rightMainCenterAt(trackS + rearD);
        for (const k of [-1, 1]) {
          if (project(rearD, rearCenter + 0.52 * k, 1.18))
            glow(P.x, P.y, 0.11 * P.sc, C.tail, 0.95 * fade(rearD, 600));
        }
        if (project(rearD, rearCenter, 2.45))
          glow(P.x, P.y, 0.045 * P.sc, C.red, 0.42 * fade(rearD, 500));
      }
    }
  }

  // ---------------- Controls ----------------
  const keys = {};
  let paused = false;
  const kmhEl = document.getElementById('kmh');
  const hud = document.getElementById('hud');
  const pauseBtn = document.getElementById('pause');
  const trackModeBtn = document.getElementById('trackMode');

  function updateTrackModeButton() {
    const displayedMode = trackModeTransition ? trackModeTransition.to : quadrupleTrack;
    trackModeBtn.textContent = (displayedMode ? T.quadrupleTrack : T.doubleTrack)
      + (trackModeTransition ? '…' : '');
    trackModeBtn.disabled = !!trackModeTransition;
    trackModeBtn.setAttribute('aria-pressed', String(displayedMode));
    trackModeBtn.setAttribute('aria-label', displayedMode ? T.switchToDouble : T.switchToQuadruple);
  }

  trackModeBtn.addEventListener('click', () => {
    if (trackModeTransition) return;
    const start = findTrackModeTransitionStart();
    trackModeTransition = {
      start,
      end: start + TRACK_MODE_TRANSITION_LENGTH,
      from: quadrupleTrack,
      to: !quadrupleTrack,
    };
    updateTrackModeButton();
  });

  function updateTrackModeTransition() {
    if (!trackModeTransition || trackS < trackModeTransition.end) return;
    quadrupleTrack = trackModeTransition.to;
    trackModeTransition = null;
    updateTrackModeButton();
  }
  updateTrackModeButton();

  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : 'Ⅱ';
    pauseBtn.setAttribute('aria-label', paused ? T.resume : T.pause);
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown') { keys[e.code] = true; e.preventDefault(); }
    if (e.code === 'Space') { togglePause(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });

  // +/- buttons accelerate/decelerate only while held
  function holdButton(id, code) {
    const b = document.getElementById(id);
    const on = e => { keys[code] = true; e.preventDefault(); };
    const off = () => { keys[code] = false; };
    b.addEventListener('pointerdown', on);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, off));
    b.addEventListener('keydown', e => { if (e.key === 'Enter') keys[code] = true; });
    b.addEventListener('keyup', e => { if (e.key === 'Enter') keys[code] = false; });
  }
  holdButton('faster', 'ArrowUp');
  holdButton('slower', 'ArrowDown');
  pauseBtn.addEventListener('click', togglePause);

  // Konami code (↑↑↓↓←→←→BA) summons the UFO; compare the last 10 keys so extra presses don't break it
  const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
  const recent = [];
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    recent.push(e.key.length === 1 ? e.key.toLowerCase() : e.key);
    if (recent.length > KONAMI.length) recent.shift();
    if (recent.length === KONAMI.length && recent.every((k, i) => k === KONAMI[i])) {
      recent.length = 0;
      summonUfo();
    }
  });

  // touch alternative: tap the speedometer 10 times in a row (gaps under 1.5 s)
  let taps = 0, lastTap = 0;
  document.querySelector('.speed').addEventListener('pointerdown', e => {
    const now = performance.now();
    taps = now - lastTap < 1500 ? taps + 1 : 1;
    lastTap = now;
    if (taps >= 10) { taps = 0; summonUfo(); }
  });

  // fullscreen (hide the button where the API is unavailable, e.g. iPhone Safari)
  const fsBtn = document.getElementById('fs');
  const fsRoot = document.documentElement;
  const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (!(fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen)) {
    fsBtn.style.display = 'none';
  } else {
    const toggleFullscreen = () => {
      if (fsActive()) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        try {
          const p = (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen).call(fsRoot);
          if (p && p.catch) p.catch(() => {});
        } catch (e) {}
      }
    };
    fsBtn.addEventListener('click', toggleFullscreen);
    window.addEventListener('keydown', e => { if (e.code === 'KeyF') toggleFullscreen(); });
    // Esc also leaves fullscreen, so track the state via the change event
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(t =>
      document.addEventListener(t, () => {
        fsBtn.textContent = fsActive() ? '⊡' : '⛶';
        fsBtn.setAttribute('aria-label', fsActive() ? T.fsExit : T.fs);
      }));
  }

  let idleTimer = 0;
  function wake() { hud.classList.remove('idle'); idleTimer = 0; }
  window.addEventListener('pointermove', wake);
  window.addEventListener('keydown', wake);

  // ---------------- Main loop ----------------
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) speed = 14;

  let prev = performance.now(), time = 0, lastKmh = -1;
  function frame(now) {
    let dt = (now - prev) / 1000; prev = now;
    if (dt > 0.05) dt = 0.05;

    if (keys.ArrowUp) speed += 8 * dt;
    if (keys.ArrowDown) speed -= 8 * dt;
    speed = Math.min(45, Math.max(0, speed));

    idleTimer += dt;
    if (idleTimer > 4) hud.classList.add('idle');

    if (!paused) {
      time += dt;
      heading += curvature(trackS) * speed * dt;
      trackS += speed * dt;
      updateTrains(dt);
      updateMeteors(dt);
      updateUfo(dt);
    }
    updateTrackModeTransition();
    updateTrackShape();

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#02030a';
    ctx.fillRect(0, 0, SW, SH);

    ctx.globalCompositeOperation = 'lighter';   // additive blending
    drawSkyGlow();
    drawStars(time);
    drawCity(time);
    drawMeteors();
    drawUfo();
    drawRailway();
    drawStoppedTrains();
    drawTrains();

    const kmh = Math.round(speed * 3.6);
    if (kmh !== lastKmh) { kmhEl.textContent = kmh; lastKmh = kmh; }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
